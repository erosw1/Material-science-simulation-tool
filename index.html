function polyShapeE(m,T){

/* ---- incandescence ---- */
function blackbodyRGB(T){
  const t=U.clamp(T,1000,40000)/100; let r,g,b;
  if(t<=66){r=255;g=99.4708025861*Math.log(t)-161.1195681661;}
  else{r=329.698727446*Math.pow(t-60,-0.1332047592);g=288.1221695283*Math.pow(t-60,-0.0755148492);}
  if(t>=66) b=255; else if(t<=19) b=0; else b=138.5177312231*Math.log(t-10)-305.0447927307;
  if(T<1000){const x=U.clamp((T-700)/300,0,1);g*=0.55+0.45*x;b*=x;}
  return [U.clamp(r,0,255)|0,U.clamp(g,0,255)|0,U.clamp(b,0,255)|0];
}
function glowInfo(T){
  const I=Math.pow(U.clamp((T-720)/1100,0,1),1.35);

  if(T>=2600) name='blinding white';
  else if(T>=1600) name='white';
  else if(T>=1350) name='yellow';
  else if(T>=1180) name='orange';
  else if(T>=1000) name='cherry red';
  else if(T>=880) name='dull red';
  else if(T>=798) name='faint red (Draper point)';
  return {I,rgb:blackbodyRGB(Math.max(T,800)),name};

/* ---- stress–strain curve at T ---- */
function stressStrain(m,p){
  const k=kind(m), S=p.struct;

    if(S.s==='B2'){const up=420+6*(p.T-318), lo=up-230; const e1=up/E*100;

    else{const pl=150; const e1=pl/E*100; [[0,0],[e1,pl],[e1+5,pl*1.15],[e1+5+400/(75000)*100,pl*1.15+400],[12,p.uts*0.9],[p.el,p.uts]].forEach(q=>pts.push(q)); return {pts,fail:true};}
  }

    const tg=m.tg||200;
    if(m.xl&&p.T>tg+8){ // rubber elasticity with finite extensibility
      const lmax=1+p.el/100, G=E/3; const n=60;
      let s1=0; for(let i=0;i<=n;i++){const l=1+(lmax-1)*i/n; s1=G*(l-1/(l*l))/(1-0.85*Math.pow((l-1)/(lmax-1),3)); pts.push([(l-1)*100,s1]);}
      const sc=p.uts/s1; pts.forEach(q=>q[1]*=Math.min(sc,8)); pts[pts.length-1][1]=p.uts; return {pts,fail:true};
    }
    if(p.el<6||p.ys==null){const ef=Math.min(p.el,p.uts/E*100*1.15); const n=24; for(let i=0;i<=n;i++){const e=ef*i/n; const s=p.uts*(1-Math.pow(1-e/ef,1.6*0+1.25))*(1)+0; pts.push([e,Math.min(E*e/100,p.uts*Math.pow(e/ef,0.85))]);} pts[pts.length-1][1]=p.uts; return {pts,fail:true};}
    const ey=Math.max(p.ys/E*100*1.5,2.5); const draw=0.8*p.ys;
    const n=12; for(let i=0;i<=n;i++){const e=ey*i/n;pts.push([e,p.ys*Math.sin(Math.PI/2*e/ey)]);}
    pts.push([ey*1.5,draw*1.02],[ey*2.2,draw]);
    const eh=p.el*0.75; if(eh>ey*2.2) pts.push([eh,draw*1.03]);
    pts.push([p.el,Math.max(p.uts,draw*1.1)]); return {pts,fail:true};
  }

    const ef=p.uts/E*100; if(p.el>ef&&p.el<1.2&&k==='met'){pts.push([0,0],[ef*0.8,p.uts*0.8],[p.el,p.uts]);}
    else pts.push([0,0],[ef,p.uts]);
    return {pts,fail:true,brittle:true};
  }
  const ey=p.ys/E*100; pts.push([0,0],[ey,p.ys]);
  const eu=Math.max(ey+0.2,Math.min(0.62*p.el,25)); const e0=(eu-ey)/2.6;

  return {pts,fail};

/* ======================= PHASE DIAGRAMS ======================= */
function interp(arr,x){ if(x<=arr[0][0]) return arr[0][1]; for(let i=1;i<arr.length;i++){ if(x<=arr[i][0]){const [x0,y0]=arr[i-1],[x1,y1]=arr[i]; return y0+(y1-y0)*(x-x0)/(x1-x0);} } return arr[arr.length-1][1]; }

    liqB:c=>D.TB-(D.TB-D.TE)*Math.pow(Math.max(0,XB-c)/(XB-D.cE),P),
    cLA:T=>D.cE*Math.pow(U.clamp((D.TA-T)/(D.TA-D.TE),0,1),1/P),
    cLB:T=>XB-(XB-D.cE)*Math.pow(U.clamp((D.TB-T)/(D.TB-D.TE),0,1),1/P),
    cSA:T=>D.am*U.clamp((D.TA-T)/(D.TA-D.TE),0,1),
    cSB:T=>XB-(XB-D.bm)*U.clamp((D.TB-T)/(D.TB-D.TE),0,1),
    solvA:T=>D.a0+(D.am-D.a0)*Math.pow(U.clamp((T-lowT)/(D.TE-lowT),0,1),2),
    solvB:T=>D.b0-(D.b0-D.bm)*Math.pow(U.clamp((T-lowT)/(D.TE-lowT),0,1),2)

/* returns {key,label,phases:[{n,c,f}],micro:[{type,frac,col,desc}]} ; c wt% B, T °C */
function phaseAt(D,c,T){

    if(T>=tl) return {key:'L',label:'L (liquid)',phases:[{n:'Liquid',c,f:1}],micro:[{type:'liquid',frac:1}]};
    if(T<=ts) return {key:'a',label:D.names.a,phases:[{n:D.names.a,c,f:1}],micro:[{type:'grain',col:'a',frac:1}]};
    const cL=invInterp(D.liq,T),cS=invInterp(D.sol,T); const fs=U.clamp((c-cL)/(cS-cL),0,1);
    return {key:'La',label:'L + '+D.names.a,phases:[{n:'Liquid',c:cL,f:1-fs},{n:D.names.a,c:cS,f:fs}],micro:[{type:'grain',col:'a',frac:fs,dend:true},{type:'liquid',frac:1-fs}]};
  }

    const F=eutFns(D);
    if(T>=D.TE){

        if(T>=F.liqA(c)) return {key:'L',label:'L (liquid)',phases:[{n:'Liquid',c,f:1}],micro:[{type:'liquid',frac:1}]};
        const cs=F.cSA(T); if(c<=cs) return {key:'a',label:D.names.a,phases:[{n:D.names.a,c,f:1}],micro:[{type:'grain',col:'a',frac:1}]};

/* ---------- drag & drop (pointer based: works for mouse and touch) ---------- */

    ev.preventDefault(); const g=$('#ghost'); g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';

function isAlloyable(m){ return kind(m)==='met'&&m.c!=='composite'&&((m.c==='metal'&&BASE_METALS.includes(m.f))||(m.base&&m.comp)); }

function notesFor(s,p){

  if(p.sc) add('cold','<b>Superconducting.</b> Zero resistance, and magnetic fields are expelled: the magnet floats.');

/* ---------- which diagram to show ---------- */
const DIAG_FOR={Fe:'FeC',Cu:'CuNi',Ni:'CuNi',Pb:'PbSn',Sn:'PbSn',Al:'AlSi',Si:'AlSi',Ag:'CuAg',Au:'AgAu',Bi:'SnBi',Mg:'MgAl'};
function specDiag(m){
  if(m.comp&&m.base){ const dg=findDiagram(m.base,Object.entries(m.comp).map(([el,w])=>({el,w}))); if(dg&&(!dg.approx||dg.rest<=3||dg.key==='FeC')) return dg; }
  const el=m.c==='metal'?m.f:(m.id==='si'?'Si':null);
  if(el&&DIAG_FOR[el]){const key=DIAG_FOR[el],D=DIAGRAMS[key]; return {key,D,cB:D.A===el?0:(D.xb||100),pure:true};}
  return null;
}
function diagramFor(s,sel){
  const preview=W.op==='alloy'&&FGX.forSpec===s.id&&FGX.res;
  if(sel&&sel!=='auto'){ const D=DIAGRAMS[sel]; const own=preview&&FGX.dg?FGX.dg:specDiag(s.m); const fits=!!(own&&own.key===sel);
    return {dg:{key:sel,D},cB:fits?own.cB:0,Tk:preview&&fits?FGX.T:s.T,marker:fits,msg:''}; }
  if(preview){ if(FGX.dg) return {dg:FGX.dg,cB:FGX.dg.cB,Tk:FGX.T,marker:true,msg:'Previewing your alloy recipe from the Alloy operation.'}; return {msg:'No built-in diagram for this recipe. Pick one from the list to explore.'}; }
  const d=specDiag(s.m);
  if(!d) return {msg:`No binary diagram is built in for ${esc(s.m.n)}. Pick any diagram from the list to explore it.`};
  return {dg:d,cB:d.cB,Tk:s.T,marker:true,msg:d.pure?`Pure ${esc(s.m.n)} sits on the edge of this diagram. Alloy it to move along the composition axis.`:`${esc(s.m.n)} at its current temperature; the marker moves as it heats${d.approx?' (minor elements ignored)':''}.`};
}

const LAMBDA=1.5406;
function xrdPattern(m,p){

  if(p.phase==='gas'||(m.c==='composite')) return {halo:[],peaks:[],note:p.phase==='gas'?'A gas gives no diffraction pattern.':'Composite: the pattern is the sum of its phases.'};

    if(k==='poly'&&m.xc&&p.phase!=='liquid'){ [[21.4,'110'],[23.9,'200'],[36.1,'020']].forEach(([tt,h],i)=>peaks.push({tt,I:100*m.xc*(i===0?1:i===1?0.35:0.1),hkl:h})); }

    switch(S.s){case 'BCC':case 'BCT':return (h+k+l)%2===0?1:0; case 'FCC':return allOdd||allEven?1:0; case 'RS':case 'FLU':return allOdd||allEven?(allEven?1:0.55):0;
      case 'DC':return allOdd?1:(allEven&&(h+k+l)%4===0?1:0); case 'ZB':return allOdd?1:(allEven?((h+k+l)%4===0?1:0.12):0);
      case 'B2':case 'B19':return (h+k+l)%2===0?1:0.12; case 'L12':return allOdd||allEven?1:0.1; case 'BST':return (h+k+l)%2===0&&!(h===0&&k===0&&l%4!==0)?1:0;

    const f=allow(h,kk,l); if(!f) continue;
    let inv; if(hex) inv=4/3*(h*h+h*kk+kk*kk)/(a*a)+l*l/(c*c); else if(tet) inv=(h*h+kk*kk)/(a*a)+l*l/(c*c); else inv=(h*h+kk*kk+l*l)/(a*a);
    const d=1/Math.sqrt(inv); const sn=LAMBDA/(2*d); if(sn>=1) continue; const th=Math.asin(sn), tt=2*th*180/Math.PI; if(tt<15||tt>110) continue;
    const key=tt.toFixed(2);
    if(!map[key]){ const lab=hex||tet?`${Math.abs(h)}${Math.abs(kk)}${Math.abs(l)}`:[Math.abs(h),Math.abs(kk),Math.abs(l)].sort((x,y)=>y-x).join(''); map[key]={tt,I:0,hkl:lab,d}; }

}

  if(m.ht&&s.aust>0&&s.cw0>0){ s.cw=0; s.cw0=0; s.rx=0; s.rxt=0; s._pchg=true; slog(s,'Austenite formed: the cold-worked structure is wiped out by the phase change.'); }
  const hom=s.T/m.tm;
  if(s.cw0>0.005){
    const Tr=trx(m,s.cw0);
    if(s.T>0.75*Tr){
      s.rxt+=dt*Math.exp(22*(s.T/Tr-1))/60; const X=1-Math.exp(-0.693*s.rxt*s.rxt);

      const drx=U.clamp(7*Math.pow(Math.max(s.cw0,0.03),-0.75),4,Math.max(4,s.dDef));
      s.rx=X; s.cw=s.cw0*(1-X); s.d=U.lerp(s.dDef,drx,X); s._pchg=true;
      if(X>0.995){ s.cw=0; s.cw0=0; s.rx=1; s.rxt=0; s.d=drx; s.dDef=drx; slog(s,`Recrystallised: new equiaxed grains, d ≈ ${fmtD(drx)}. The cold-work hardening is gone.`); }
    }
  } else if(hom>0.5){
    const K=300*Math.exp(16*(hom-0.9)), d0=s.d; s.d=Math.min(800,Math.sqrt(s.d*s.d+K*dt)); s.dDef=s.d; s._pchg=true;
    if(d0<2*D0(m)&&s.d>=2*D0(m)) slog(s,'Grain growth: boundaries migrate to cut their total area; strength drops a little (Hall–Petch).');
  }
  if(s._pchg&&s.t-(s._p293t||-9)>1){ s._pchg=false; s._p293t=s.t; s.p293=propsAt(m,293,specState(s)); s.ptc=null; }
}
function rollPass(s,r){
  const m=s.m, p=s.p;

  const Tr=trx(m,0.3), hot=s.T>Tr;
  const e293=s.p293.el;
  if(!hot&&(p.el==null||p.el<3)){ toast(`Cracked! At ${num(p.el||0,2)}% elongation it is too brittle to cold-roll. Anneal it first.`); slog(s,'Rolling pass failed: the specimen cracked (too little ductility left).'); return; }
  s.h=s.h*(1-r);
  s._roll={t:0,hin:s.h/(1-r),hout:s.h};
  if(hot){ const d0=s.d; s.d=Math.max(5,s.d*Math.pow(1-r,1.2)); s.dDef=s.d; s.cw=0; s.cw0=0; s.rx=1; slog(s,`Hot rolled ${Math.round(r*100)}% above T_rx: recrystallises as it deforms, no hardening; grains refined ${fmtD(d0)} → ${fmtD(s.d)}.`); }
  else { const tot=1-(1-s.cw)*(1-r); s.cw=Math.min(0.92,tot); s.cw0=s.cw; s.rxt=0; s.rx=0; s.dDef=s.d; slog(s,`Cold rolled ${Math.round(r*100)}% (stored cold work now ${Math.round(s.cw*100)}%): dislocations multiply and tangle.`); }
  s.p293=propsAt(m,293,specState(s)); s.ptc=null; INS.dirty=true;
}

function ironish(m){ return m.id==='fe'||m.steel||m.ht||/^(st|ss|duplex|ph174|castiron)/.test(m.id)||m.base==='Fe'; }
function tiish(m){ return m.id==='ti'||m.id==='ti64'||m.base==='Ti'; }
const FINISH=[['polished','Mirror polished',1],['ground','Ground',0.9],['machined','Machined',0.76],['rolled','Hot-rolled skin',0.6],['forged','As forged',0.45]];
function fatigueModel(m,p,ka){
  const k=kind(m), uts=Math.max(1,p.uts); let sf,b,Se=null;
  if(m.c==='composite'||m.c==='fiber'){ sf=uts*1.0; b=-0.07; }
  else if(k==='met'){ sf=uts+345*Math.min(1,uts/300); b=-0.085; if(ironish(m)||tiish(m)) Se=Math.min(0.5*uts,700); }
  else if(k==='poly'){ sf=uts*1.05; b=-0.09; }
  else { sf=uts*1.1; b=-0.035; }
  const kaN=N=>1-(1-ka)*U.clamp((Math.log10(Math.max(N,1))-3)/3,0,1);
  const S=N=>{ const v=kaN(N)*sf*Math.pow(2*N,b); return Se!=null?Math.max(v,ka*Se):v; };
  const life=sa=>{ if(sa>=uts) return 1; if(Se!=null&&sa<=ka*Se*1.0001) return Infinity; let lo=0,hi=12; for(let i=0;i<50;i++){const mid=(lo+hi)/2; if(S(Math.pow(10,mid))>sa) lo=mid; else hi=mid;} const N=Math.pow(10,(lo+hi)/2); return N>=1e12?Infinity:Math.max(1,N); };
  return {sf,b,Se,S,life,uts,ka};
}
function goodman(sa,sm,uts){ return sm>=uts?Infinity:sa/(1-sm/uts); }
const FTG={sa:null,sm:0,fin:'machined',run:null};
const fmtN=N=>N===Infinity?'∞':(N<1e4?Math.round(N).toLocaleString('en-US'):sci(N,2));

const CREEPK={in718:1e-3,waspaloy:3e-4,stellite:3e-3,ni3al:1e-3,c276:1e-2,nichrome:2e-2,monel:0.1,ss304:0.05,ss316:0.04,duplex:0.06,ph174:0.1,h13:0.1,m2:0.08,d2:0.1,ti64:0.2,w:0.3,mo:0.3,re:0.2,ta:0.4,sic:1e-2,si3n4:1e-2,sicsic:1e-3,al2o3:0.05,zro2:0.2,cc:1e-3};
function creepTm(m){ return m.tm||m.td||m.tb||(m.tg?m.tg*1.6:2500); }
function creepModel(m,Tc,sig,st){
  const k=kind(m), Tm=creepTm(m), p0=propsAt(m,293,st||{}), pT=propsAt(m,Tc,st||{});
  const sref=Math.max(1,p0.uts), n=k==='met'?5:(k==='poly'?3.2:3), Qr=k==='poly'?14:18;
  let A=2e10*(CREEPK[m.id]||m.creepK||1); if(k==='cer') A*=0.02; if(m.c==='composite'&&k!=='poly') A*=0.05;
  if(k==='poly'&&m.tg&&Tc>m.tg&&!m.xl) A*=300;
  const hom=Tc/Tm;
  const rate=A*Math.pow(sig/sref,n)*Math.exp(-Qr/Math.max(hom,0.01));
  const E=Math.max(1e-3,pT.E||0.001), eps_e=sig/(E*1000);
  const er=U.clamp((pT.el!=null?pT.el:1)/100*0.8,0.01,k==='poly'?2:0.5);
  const broke=pT.uts<=sig||pT.phase==='liquid';
  const C=0.35*er, tr=broke?0:C/Math.max(rate,1e-40);
  const ep=Math.min(0.15*C,0.05), tp=0.08*tr, eter=Math.max(0,er-eps_e-ep-C), q=8;
  const strain=t=>{ if(broke) return eps_e; const tt=Math.min(t,tr); return eps_e+ep*(1-Math.exp(-tt/Math.max(tp,1e-30)))+rate*tt+eter*(Math.exp(q*tt/tr)-1)/(Math.exp(q)-1); };
  const regime=hom<0.3?'negligible creep (below 0.3 T_m)':(sig/sref<0.02?'diffusional creep (n≈1)':'power-law dislocation creep');
  return {rate,tr,eps_e,er,strain,hom,n,Tm,regime,broke,uts:pT.uts,E,LMP:tr>0?Tc*(20+Math.log10(Math.max(tr/3600,1e-30))):null};
}

/* ---------- HEAT / COOL ---------- */
function heatPresets(m){
  const P=[['LHe',4.2],['LN₂',77],['Room',293],['Boiling water',373]];
  if(m.tg) P.push(['Tg+30',m.tg+30]); if(m.ht) P.push(['Austenitise',m.si.A3+60]);
  if(m.tr) m.tr.slice(0,2).forEach(t=>{if(t.T>300)P.push([t.name.split(' ')[0],t.T+20]);});
  if(m.tc&&m.tc>300) P.push(['Curie',m.tc+20]); if(m.tm) P.push(['Melt',m.tm+(m.fr||0)+60]);
  if(m.tb) P.push([m.tm?'Boil':'Sublime',m.tb+150]); else if(m.td) P.push(['Decompose',m.td+60]);
  return P;
}

function drawRig(cv,s){

function selInv(cv){ return cv._inv||null; }
function selDraw(pane){
  const cv=pane.querySelector('canvas'); if(!cv) return; const {ctx,w,h}=fit(cv); if(w<80) return; ctx.clearRect(0,0,w,h);
  const ax=AXES[SEL.x],ay=AXES[SEL.y]; const benchIds=new Set(W.items.map(s=>s.m.id));
  const all=allMats().map(m=>({m,xv:ax.f(m),yv:ay.f(m)})).filter(q=>q.xv>0&&q.yv>0&&isFinite(q.xv)&&isFinite(q.yv));
  const shown=new Set(selMats().map(m=>m.id)); const mats=all.filter(q=>shown.has(q.m.id));
  const L=all.length?all:[{xv:1,yv:1}];
  const lx=L.map(q=>Math.log10(q.xv)),ly=L.map(q=>Math.log10(q.yv));
  const x0=Math.floor(Math.min(...lx)-0.15),x1=Math.ceil(Math.max(...lx)+0.15),y0=Math.floor(Math.min(...ly)-0.15),y1=Math.ceil(Math.max(...ly)+0.15);

  const X=v=>pad.l+(Math.log10(v)-x0)/(x1-x0)*pw,Y=v=>pad.t+ph-(Math.log10(v)-y0)/(y1-y0)*ph;
  cv._inv={x:px=>Math.pow(10,x0+(px-pad.l)/pw*(x1-x0)),y:py=>Math.pow(10,y0+(pad.t+ph-py)/ph*(y1-y0))};
  ctx.fillStyle=C.panel2; ctx.fillRect(pad.l,pad.t,pw,ph);
  ctx.strokeStyle=C.line2; ctx.fillStyle=C.muted; ctx.font=`10.5px ${C.mono}`; ctx.lineWidth=1;
  const lab=e=>e>=-2&&e<=4?num(Math.pow(10,e)):sci(Math.pow(10,e),1).replace(/^1\.0×|^1×/,'');
  const stx=Math.max(1,Math.ceil((x1-x0)/(pw/50))),sty=Math.max(1,Math.ceil((y1-y0)/(ph/26)));
  for(let e=x0;e<=x1;e++){const x=X(Math.pow(10,e));ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();if((e-x0)%stx===0){ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(lab(e),x,pad.t+ph+5);}}
  for(let e=y0;e<=y1;e++){const y=Y(Math.pow(10,e));ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+pw,y);ctx.stroke();if((e-y0)%sty===0){ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(lab(e),pad.l-5,y);}}
  ctx.strokeStyle=C.line; ctx.strokeRect(pad.l+0.5,pad.t+0.5,pw,ph);
  ctx.fillStyle=C.ink; ctx.textAlign='right'; ctx.textBaseline='bottom'; ctx.fillText(`${ax.n} (${ax.u}) →`,pad.l+pw,h-1); ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(`↑ ${ay.n} (${ay.u})`,pad.l,3);

  ctx.save(); ctx.beginPath(); ctx.rect(pad.l,pad.t,pw,ph); ctx.clip();
  Object.entries(byC).forEach(([c,P])=>{if(P.length<3)return;const Hh=hull(P);const cx=Hh.reduce((s,p)=>s+p[0],0)/Hh.length,cy=Hh.reduce((s,p)=>s+p[1],0)/Hh.length;ctx.beginPath();Hh.forEach((p,i)=>{const dx=p[0]-cx,dy=p[1]-cy,d=Math.hypot(dx,dy)||1;const x=p[0]+dx/d*10,y=p[1]+dy/d*10;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.fillStyle=C['c-'+c];ctx.globalAlpha=0.1;ctx.fill();ctx.globalAlpha=0.5;ctx.strokeStyle=C['c-'+c];ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=C['c-'+c]; ctx.font=`600 11px ${C.cond}`; ctx.textAlign='center'; ctx.textBaseline='middle'; const top=Hh.reduce((a,p)=>p[1]<a[1]?p:a,Hh[0]); ctx.fillText(c==='mine'?'yours':(CLASSES[c]?CLASSES[c].label:c),top[0],Math.max(pad.t+8,top[1]-16));});

  let rank=[];

    ctx.strokeStyle=C.accent; ctx.lineWidth=2.5; ctx.setLineDash([8,5]); ctx.beginPath(); ctx.moveTo(X(xa),Y(yAt(xa))); ctx.lineTo(X(xb),Y(yAt(xb))); ctx.stroke(); ctx.setLineDash([]);

    if(q.m.id===SEL.pick){ctx.strokeStyle=C.accent;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.stroke();} });

    ctx.fillStyle=C.panel2; ctx.globalAlpha=0.85; ctx.fillRect(tx-2,ty-7,tw+4,14); ctx.globalAlpha=1; ctx.fillStyle=p.m.id===SEL.pick?C.accent:C.ink; ctx.textAlign='left'; ctx.fillText(t,tx,ty); });
  ctx.restore();

  const ref=MAT.st1018; const refM=SEL.s?IDXV(ref,SEL.x,SEL.y,SEL.s):null;
  const list=SEL.s?rank.slice(0,14):mats.slice().sort((a,b)=>b.yv-a.yv).slice(0,14).map(q=>({m:q.m,M:q.yv}));
  pane.querySelector('.srank').innerHTML=list.map((q,i)=>`<li data-id="${q.m.id}" class="${q.m.id===SEL.pick?'on':''}"><span class="dot" style="background:${clsColor(q.m)}"></span><span class="nm">${i+1}. ${esc(q.m.n)}</span><span class="v">${SEL.s&&refM?'×'+num(q.M/refM,2):num(q.M,3)}</span><button class="add" title="Place on bench" aria-label="Place ${esc(q.m.n)} on the bench">+</button></li>`).join('')||'<li class="muted">Nothing passes these filters.</li>';
  if(SEL.s) pane.querySelector('.srank').insertAdjacentHTML('beforebegin','');
  const pk=MAT[SEL.pick]; const sp=pane.querySelector('.selpick');
  sp.innerHTML=pk?`<b>${esc(pk.n)}</b> · ${esc(CLASSES[pk.c]?CLASSES[pk.c].label:'')} · ${num(ay.f(pk))} ${ay.u} · ${num(ax.f(pk))} ${ax.u}${SEL.s?` · M = ${num(IDXV(pk,SEL.x,SEL.y,SEL.s),3)} (${refM?'×'+num(IDXV(pk,SEL.x,SEL.y,SEL.s)/refM,2)+' mild steel':''})`:''} · ~$${num(costOf(pk),2)}/kg <button class="btn" data-act="add">Place on bench</button> <button class="btn" data-act="use">Use in a challenge</button>`:`<span class="muted">${SEL.s?`${rank.length} of ${mats.length} materials lie above the line. Click a dot to inspect it. Ranking shows the index relative to mild steel.`:'Click a dot to inspect it.'}</span>`;
}

function chalEval(c,m){

  return {cons,pass,ov,fiber:m.c==='fiber'};

function chalBest(c){

function ageModel(id){ const A=AGE[id]; const r0=0.4e-9; const [Tp,tp,sp]=A.peak, TpK=Tp+273.15;

  const k0=(A.rc**3-r0**3)/(tp*3600)*TpK/Math.exp(-A.Q/(RGAS*TpK));
  const k=T=>k0/(T+273.15)*Math.exp(-A.Q/(RGAS*(T+273.15)));
  const strength=(f,r)=>{ if(f<=0) return 0; const sA=Math.sqrt(f*r/A.rc), sB=Math.sqrt(f)*A.rc/r; return 1/Math.sqrt(1/(sA*sA)+1/(sB*sB)); };
  const Kp=(sp-A.s0)/strength(feq(Tp),A.rc);
  const at=(T,tH)=>{ const t=tH*3600; const tpT=(A.rc**3-r0**3)/k(T); const tau=0.12*tpT; const f=feq(T)*(1-Math.exp(-t/tau)); const r=Math.cbrt(r0**3+k(T)*t); const N=f>0?0.012*f/(4/3*Math.PI*r**3):0; return {f,r,N,ys:A.s0+Kp*strength(f,r),tp:tpT/3600}; };
  return {A,at,k,feq,Kp};
}

 <li><b>Fast fracture</b> when K reaches the material's fracture toughness K_IC. Doubling the crack size cuts the critical stress by √2. Tough steels: 50–200 MPa√m; aluminium alloys: 20–40; glass: under 1.</li>
 <li><b>Fatigue crack growth.</b> Each cycle the crack tip blunts and resharpens, advancing about da/dN = C·ΔK^m (Paris & Erdogan, 1963). With m ≈ 3, a crack grows slowly at first and faster and faster later, so most of the life is spent while the crack is small.</li>
 <li><b>Damage tolerance</b> (aircraft, pipelines, bridges): assume a crack just below what inspection can find, calculate how long it takes to reach critical size, and inspect at least twice in that time. That is what the remaining-life tab does.</li>
 <li><b>Beach marks</b> on real fracture surfaces are the crack fronts at moments when the loading changed. They point back to the origin.</li></ul>

function mscDraw(){ const cv=$('#ms-cv'); if(!cv) return; const S=mscSample(); const ov=$('#ms-ov'); const oc=ov.getContext('2d');
  if(S.none){ const c=cv.getContext('2d'); cv.width=cv.clientWidth; cv.height=cv.clientHeight; c.fillStyle='#1c1a18'; c.fillRect(0,0,cv.width,cv.height); c.fillStyle='#aaa'; c.font='14px sans-serif'; c.fillText(S.cap||'Nothing solid to polish.',20,30); $('#ms-read').innerHTML=''; $('#ms-cap').textContent=''; return; }
  const R=renderMicro(cv,S.parts,{...S.opt,mag:+MSC.mag,mode:MSC.mode,measure:MSC.tool});
  const dpr=R.dpr; ov.width=cv.width; ov.height=cv.height; oc.clearRect(0,0,ov.width,ov.height);
  let html=`<p class="small" style="margin:4px 0"><b>${esc(S.n)}</b></p>`;
  if(MSC.tool==='li'){ const L=mLinearIntercept(R,6); oc.strokeStyle='rgba(255,230,0,.9)'; oc.lineWidth=1.2*dpr; L.lines.forEach(l=>{ oc.beginPath(); oc.moveTo(0,l.y); oc.lineTo(R.W,l.y); oc.stroke(); l.hits.forEach(x=>{ oc.strokeStyle='rgba(255,40,40,.95)'; oc.beginPath(); oc.arc(x,l.y,3*dpr,0,7); oc.stroke(); oc.strokeStyle='rgba(255,230,0,.9)'; }); });
    const dIn=S.opt.d; html+=`<div class="kpi"><div><b>${L.N}</b><span>intercepts on ${num(L.L,3)} µm of line</span></div><div><b>${num(L.lbar,3)} µm</b><span>mean linear intercept ℓ̄</span></div><div><b>${num(L.G,2)}</b><span>ASTM grain size G = −6.646 log ℓ̄(mm) − 3.298</span></div>${dIn?`<div><b>${num(astmG(dIn),2)}</b><span>model value (ℓ̄ = ${num(dIn,3)} µm)</span></div>`:''}</div><p class="tiny muted">Red circles: boundary crossings. Twin boundaries are not counted, as E112 specifies for grain size.</p>`; }
  if(MSC.tool==='pc'){ const n=14; const pc=mPointCount(R,n); const cols=['#ff4040','#40c0ff','#ffd040','#60e060','#ff70ff','#ffffff']; pc.pts.forEach(([x,y,p])=>{ oc.fillStyle=p>=254?'#888':cols[p%cols.length]; oc.beginPath(); oc.arc(x,y,2.6*dpr,0,7); oc.fill(); oc.strokeStyle='#000'; oc.stroke(); });
    const bnd=pc.cnt[254]||0, valid=pc.n-bnd; const rows=S.parts.map((p,i)=>{ const c=pc.cnt[i]||0; const fr=c/Math.max(1,valid); const ci=1.96*Math.sqrt(fr*(1-fr)/Math.max(1,valid)); return `<tr><td style="text-align:left"><i class="sw" style="background:${cols[i%cols.length]}"></i> ${esc(p.desc||p.label||({grain:p.col==='g'?'austenite':p.col==='b'?'second phase':'ferrite / matrix',lamellar:'pearlite',needles:p.bainite?'bainite':'martensite',liquid:p.eut?'eutectic':'liquid',network:'cementite network',sph:'spherulites',pores:'grains',glass:'glass',plates:'plates'})[p.type]||p.type)}</td><td>${num(fr*100,3)} ± ${num(ci*100,2)}%</td><td>${num((p.frac||0)*100,3)}%</td></tr>`; }).join('');
    html+=`<table class="chemtab"><tr><th style="text-align:left">Phase</th><th>Point count (95% CI)</th><th>Model</th></tr>${rows}</table><p class="tiny muted">${pc.n} points, ${bnd} fell on boundaries and were skipped. Uncertainty shrinks as 1/√points.</p>`; }
  $('#ms-read').innerHTML=html; $('#ms-cap').textContent=S.cap||''; }
function mscHelp(f,P){ P.innerHTML=`<div class="col" style="max-width:880px;gap:6px"><ul class="notes">
 <li><b>Etching</b> attacks grain boundaries and some phases faster than others, so after polishing they show up as dark lines and shades. Nital (nitric acid in alcohol) for steels, Keller's reagent for aluminium.</li>
 <li><b>Pearlite</b> is alternating plates of soft ferrite and hard cementite. Below about 500× the plates are too fine to resolve and pearlite simply looks dark; that is why a 1018 steel looks like white grains with dark islands.</li>
 <li><b>Martensite</b> forms without diffusion, in packets of parallel laths inside each old austenite grain. Tempering precipitates fine carbides (dark specks).</li>
 <li><b>Annealing twins</b> (straight parallel lines across a grain) are typical of FCC metals with low stacking-fault energy: copper, brass, austenitic stainless steel.</li>
 <li><b>Dendrites</b> grow from the melt as branched crystals. The secondary arm spacing λ₂ scales with local freezing time as t_f^⅓: fine arms mean fast cooling and better properties.</li>
 <li><b>EBSD</b> (electron backscatter diffraction) colours each grain by its crystal orientation. Differently coloured packets inside a prior austenite grain reveal martensite variants.</li>
 <li><b>Grain size</b>, ASTM E112: count how many grain boundaries a test line crosses. G = 1 is very coarse (~250 µm), G = 8 is about 22 µm, G = 12 is about 5.6 µm. Finer grains are stronger (Hall–Petch) and tougher.</li></ul></div>`; }

(function(){ const H0=renderHelp; renderHelp=function(f){ if(f.o.key==='new'){ f.body.innerHTML=`<h3 class="ih3" style="margin:0 0 6px">EML v4: deeper science</h3><ul class="notes">

   <li><b>Thermodynamics</b>: phase diagrams calculated from Gibbs energies (CALPHAD-style convex hull): the Fe–Cr–Ni ternary with tie-lines and the lever rule, binary diagrams with measured points for validation, Gibbs-energy curves with the common tangent, and why stainless steel is stainless.</li>
   <li><b>Diffusion & kinetics</b>: TTT and CCT diagrams for real steel compositions (Kirkaldy–Venugopalan), with predicted hardness, microstructure and Jominy curve; carburizing depth profiles (Fick's law with carbon-dependent diffusivity); precipitation ageing curves, coarsening and a simulated TEM image.</li>
   <li><b>Fracture mechanics</b>: Paris-law crack growth, critical crack size, remaining life and inspection interval for a crack found in service.</li>
   <li><b>Corrosion</b>: galvanic couples by mixed-potential theory (Evans diagram), pitting resistance (PREN, critical temperature, extreme-value pit depth) and stress-corrosion cracking (K_ISCC, crack velocity, time to failure).</li>
   <li><b>Manufacturing</b>: casting solidification with shrinkage porosity and the Niyama criterion; welding heat-affected zones and hardness traverses (steel, 6061, 304); metal 3-D printing residual stress and warping.</li>
   <li><b>Engineering codes</b> (v4.1): Eurocode 3 beam/column checks with the German National Annex, EN 10025 steel grades, VDI 2230 bolted joints, FKM fatigue assessment and ISO 286 fits, each with clause references and benchmarks against published tables.</li>

  if(f.o.key==='about'){ f.body.innerHTML=`<div style="display:flex;gap:14px;align-items:flex-start"><span class="tbicon" style="width:42px;height:42px"></span><div><h3 class="ih3" style="font-family:var(--f-display);margin:0 0 4px;font-size:22px">Eros' Metallurgy Lab <span class="muted" style="font-size:15px">EML ${EML_VERSION}</span></h3><p class="small" style="margin:0 0 8px">A materials-science workbench: ${MATS.length} materials, heat treatment, cold rolling and annealing, alloys, composites, tensile, fatigue and creep testing, phase diagrams, X-ray diffraction and an Ashby material selector with design challenges.</p><p class="tiny muted" style="margin:0">Property models are simplified teaching models (homologous-temperature scaling, Hall–Petch, Basquin, Norton, JMAK, Halpin–Tsai…). Use them to build intuition, not to certify a design.</p><p class="tiny" style="margin:6px 0 0">Every analysis now states its <b>model validity</b> limits, every property carries a <b>source tag and typical spread</b>, and the solvers are checked against textbook cases at start-up (Help ▸ Benchmarks).</p></div></div>`; return; }
  if(f.o.key==='new'){ f.body.innerHTML=`<h3 class="ih3" style="margin:0 0 6px">EML v3: results you can trust</h3><ul class="notes">
   <li><b>Benchmarks</b> (Help ▸ Benchmarks): the lab's own solvers re-run textbook cases (beams, sections, finite elements, Lamé cylinders, discs, buckling, Mohr's circle, laminates) and measured data (X-ray peaks, lattice densities, Lorenz number). Pass/fail with tolerances and sources. Runs at start-up; the result is in the status bar.</li>
   <li><b>Mesh convergence</b>: see the finite-element peak stress approach the handbook value as the mesh is refined.</li>
   <li><b>Data provenance</b>: each property in the Properties panel has a tag showing whether it is a literature value, a design-code table, a model prediction or an estimate, plus its typical ± spread.</li>
   <li><b>Design-code temperature data</b>: carbon steels, stainless steels and 6xxx aluminium now use reduction-factor tables (EN 1993-1-2 / EN 1999-1-2) for strength and stiffness at temperature.</li>
   <li><b>Safety-factor ranges</b>: safety factors now show a 5–95% band from material scatter, not just one number.</li>
   <li><b>Model validity checks</b>: every analysis lists its assumptions and warns automatically when you leave the range where they hold (yielding, slender beams, coarse meshes, thin walls, high temperature…).</li></ul><p class="tiny muted">v2 is the previous release: shape-first stress analyzer, cost estimator, laminates, real-world uses.</p>`; return; }
  const K=[['H','Heat / cool'],['R','Roll / anneal'],['A','Alloy'],['C','Make composite'],['T','Tensile test'],['F','Fatigue test'],['K','Creep test'],['D','Duplicate specimen'],['X','Add / remove from comparison'],['Del','Remove specimen'],['M','Material selector'],['G','Design challenges'],['L','Laminate & sandwich designer'],['S','Stress analyzer'],['$','Cost estimator'],['B','Benchmarks & data sources'],['I','Parameter encyclopedia'],['Esc','Hide the operations panel'],['Shift-click','Tick cards to compare'],['Right-click','Specimen menu'],['Double-click','Heat / cool']];
  f.body.innerHTML=`<table class="chemtab">${K.map(([k,n])=>`<tr><td style="font-family:var(--f-mono)"><b>${k}</b></td><td style="text-align:left;font-family:var(--f-body)">${n}</td></tr>`).join('')}</table>`;
}
function statusBar(){
  const s=spec(W.sel); const e=$('#sb-spec'); if(!e) return;
  e.textContent=s?`${s.m.n} · ${fT(s.T)} · ${s.p?s.p.state:''}`:'No specimen selected';
  $('#sb-time').textContent=W.speed===0?'Paused':`Sim speed ${W.speed}×`+(s?` · t = ${Math.round(s.t)} s`:'');
  $('#sb-n').textContent=`${W.items.length} specimen${W.items.length===1?'':'s'}`;
  const d=$('#tb-doc'); if(d) d.textContent=s?' — '+s.m.n:'';
}
(function(){ const t0=toast; toast=function(msg){ t0(msg); const sb=$('#sb-msg'); if(sb){ sb.textContent=msg; clearTimeout(statusBar._t); statusBar._t=setTimeout(()=>{sb.textContent='Ready';},6000);} }; })();
function initShell(){
  renderMenubar(); setInterval(statusBar,300); statusBar(); setTimeout(()=>{ sbBench(); runBench(null,true); },1500);
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&MENU.open!=null){closeDrop();e.stopPropagation();}
    if(e.altKey&&!e.ctrlKey&&!e.metaKey){ const i=menuDefs().findIndex(([n])=>n[0].toLowerCase()===e.key.toLowerCase()); if(i>=0){e.preventDefault();openDrop(i);} }
    const d=$('#mdrop'); if(d&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ e.preventDefault(); const it=[...d.querySelectorAll('.mi:not(:disabled)')]; const i=it.indexOf(document.activeElement); const n=it[(i+(e.key==='ArrowDown'?1:-1)+it.length)%it.length]; if(n) n.focus(); }
    if(d&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ e.preventDefault(); const n=menuDefs().length; openDrop((MENU.open+(e.key==='ArrowRight'?1:-1)+n)%n); } },true);
  const opHint=e=>{const b=e.target.closest('.tb,.btn,.mi,.chip'); const sb=$('#sb-msg'); if(!b||!sb) return; const t=b.getAttribute('title'); if(t){ sb.textContent=t; clearTimeout(statusBar._t); statusBar._t=setTimeout(()=>{sb.textContent='Ready';},3000);} };
  document.addEventListener('mouseover',opHint);
}
</script>
