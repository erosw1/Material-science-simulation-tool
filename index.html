/* ============ CRUCIBLE · PHYSICS MODELS ============ */
const U = {
  clamp:(x,a,b)=>Math.max(a,Math.min(b,x)),
  lerp:(a,b,t)=>a+(b-a)*t,
  smooth(e0,e1,x){const t=U.clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);},
  rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};},
  hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
};
const kB_eV = 8.617e-5, NA = 6.02214e23, SIGMA = 5.670e-8;
const MAT = {};
function registerMat(m){ MAT[m.id]=m; prepMat(m); }

function kind(m){
  if(m.model) return m.model;
  return {metal:'met',alloy:'met',polymer:'poly',ceramic:'cer',semi:'cer',fiber:'cer',composite:'poly'}[m.c]||'met';
}

/* ---- steels: transformation temperatures from composition (Andrews, Fe–C diagram) ---- */
function steelInfo(m){
  const c=m.comp||{}; const C=c.C||0,Mn=c.Mn||0,Ni=c.Ni||0,Si=c.Si||0,Cr=c.Cr||0,Mo=c.Mo||0,V=c.V||0,W=c.W||0;
  const A1=723-10.7*Mn-16.9*Ni+29.1*Si+16.9*Cr+6.38*W;
  let A3=910-203*Math.sqrt(Math.min(C,0.76))-15.2*Ni+44.7*Si+104*V+31.5*Mo+13.1*W;
  if(C>=0.76) A3=727+(Math.min(C,2.14)-0.76)/1.38*(1148-727);
  A3=Math.max(A3,A1+8);
  const Ms=539-423*Math.min(C,1.2)-30.4*Mn-17.7*Ni-12.1*Cr-7.5*Mo;
  const alloy=Cr+2*Mo+0.5*Math.max(0,Mn-0.75)+0.3*Ni+V;
  const Rc=Math.pow(10,2.6-0.8*Math.min(C,0.9)-0.55*alloy);
  return {C,A1:A1+273.15,A3:A3+273.15,Ms:Ms+273.15,Rc,hyper:C>0.76,cast:C>2.14};
}

function prepMat(m){
  if(m._prep) return; m._prep=true;
  if(m.steel && m.s==='BCC'){
    const si=steelInfo(m); m.si=si; m.ht=!si.cast && si.C>=0.1;
    const top=Math.min(si.A3, (m.tm||1700)-20);
    m.tr=[{T:si.A1,s:'BCC',name:si.cast?'γ + graphite':(si.hyper?'γ + Fe₃C':'α + γ (intercritical)'),mix:true,a:2.9,L:40}];
    if(!si.cast) m.tr.push({T:top,s:'FCC',name:'γ austenite',a:3.62});
  }
  if(m.tr) m.tr.sort((a,b)=>a.T-b.T);
}
MATS.forEach(registerMat);

function structAt(m,T){
  let s=m.s,name=m.sn,a=m.a,ca=m.ca,Tref=293,mix=false;
  if(m.tr) for(const t of m.tr){ if(T>=t.T){s=t.s;name=t.name;a=t.a||a;ca=t.ca||ca;Tref=t.T;mix=!!t.mix;} }
  return {s,name,a,ca,Tref,mix};
}
function cellVolume(st){
  const S=STRUCT[st.s]; if(!S||!st.a) return null;
  const a=st.a, c=(st.ca||1)*a;
  if(S.sys==='cubic') return a*a*a;
  if(S.sys==='tet') return a*a*c;
  if(S.sys==='hex') return 1.5*Math.sqrt(3)*a*a*c;
  return null;
}
function theoDensity(m,st){
  const S=STRUCT[st.s]; const V=cellVolume(st);
  if(!S||!S.n||!V||!m.M||!m.Z) return null;
  return S.n*m.M/(NA*V*1e-24);
}

/* ---- heat capacity (Debye-like), expansion (Grüneisen ∝ cp) ---- */
function dshape(T,th){const r=Math.max(T,0.3)/th;const x=77.9*r*r*r;return x/(1+x);}
function cpAt(m,T,liq){
  const k=kind(m);
  if(k==='poly'){let c=m.cp*U.clamp(0.3+0.7*T/293,0.04,2.4);if(m.tg&&T>m.tg)c*=1.2;return c;}
  const th=m.th||400, hi=m.cp/dshape(293,th);
  let c=hi*dshape(T,th);
  if(T>293) c*=1+0.08*(T-293)/(m.tm||m.td||m.tb||2000);
  if(k==='glass'&&m.tg&&T>m.tg) c*=1.15;
  if(liq) c=Math.max(c,hi*1.05);
  return c;
}
function polyG(m,T){return 1/(1+Math.exp((T-(m.tg||200))/7));}
function cteAt(m,T){
  const k=kind(m);
  if(k==='poly'){
    const mult=(m.xl||!m.xc)?2.5:1+1.5*(1-(m.xc||0));
    const f=t=>{const G=polyG(m,t);return (G+(1-G)*mult)*(t/(t+40));};
    return m.cte*f(T)/f(293);
  }
  let a0=m.cte;
  if(m.cteHot!=null&&m.tc){const w=U.smooth(m.tc-60,m.tc+40,T);a0=U.lerp(m.cte,m.cteHot,w);}
  const th=m.th||400, Tm=m.tm||m.td||m.tb||2000;
  let a=a0*dshape(T,th)/dshape(293,th)*(1+0.3*Math.max(0,T-293)/Tm);
  if(k==='glass'&&m.tg&&T>m.tg) a*=3;
  return a;
}
function thermalStrain(m,T0,T1){ // ∫ α dT (dimensionless), trapezoid
  const n=24; let s=0; const h=(T1-T0)/n;
  for(let i=0;i<=n;i++){const t=T0+h*i;const w=(i===0||i===n)?0.5:1;s+=w*cteAt(m,t);}
  return s*h*1e-6;
}

/* ---- Bloch–Grüneisen phonon resistivity ---- */
function bgInt(T,th){
  const z=th/Math.max(T,0.5); const n=60; let s=0;
  const f=x=>{if(x<1e-6)return 0;const e=Math.exp(x);return Math.pow(x,5)/((e-1)*(1-1/e));};
  const h=Math.min(z,60)/n;
  for(let i=0;i<=n;i++){const x=i*h;const w=(i===0||i===n)?1:(i%2?4:2);s+=w*f(x);}
  return Math.pow(T/th,5)*s*h/3;
}

/* ---- enthalpy table: H(T) with latent-heat plateaus ---- */
function buildH(m){
  const k=kind(m);
  const top=Math.max(m.tb||0,m.td||0,m.tm?(m.tm+(m.fr||0)):0,m.tg||0,m.becomes?m.becomes.T:0);
  const Tmax=Math.min(6000,Math.max(top+800,1200));
  const tT=[],tH=[],ev=[];
  const jumps=[];
  if(m.tr) m.tr.forEach(t=>{ if(t.L) jumps.push({T:t.T,L:t.L*1000,kind:'tr',label:t.name}); });
  let meltRange=null;
  if(m.tm&&m.lf&&!(k==='poly'&&!m.xc)){
    if(m.fr>0) meltRange={T0:m.tm,T1:m.tm+m.fr,L:m.lf*1000};
    else jumps.push({T:m.tm,L:m.lf*1000,kind:'melt',label:'melting'});
  } else if(m.tm&&k!=='poly') jumps.push({T:m.tm,L:(m.lf||300)*1000,kind:'melt',label:'melting'});
  if(m.tb){const Lv=m.lv?m.lv*1000:88*m.tb/((m.M||50)/1000);jumps.push({T:m.tb,L:Lv,kind:m.tm?'boil':'subl',label:m.tm?'boiling':'sublimation'});}
  if(m.td&&!m.tb){jumps.push({T:m.td,L:(k==='poly'?900:2000)*1000,kind:'decomp',label:k==='poly'?'decomposition':'decomposition / sublimation'});}
  jumps.sort((a,b)=>a.T-b.T);
  let H=0,T=1,ji=0; const step=Tmax>3000?2:1;
  tT.push(T);tH.push(H);
  while(T<Tmax){
    const Tn=T+step;
    while(ji<jumps.length&&jumps[ji].T<=Tn){
      const j=jumps[ji]; const liq=m.tm&&j.T>m.tm;
      H+=cpAt(m,(T+j.T)/2,liq)*(j.T-T); tT.push(j.T);tH.push(H);
      ev.push({T:j.T,H0:H,H1:H+j.L,kind:j.kind,label:j.label}); H+=j.L; tT.push(j.T);tH.push(H); T=j.T; ji++;
    }
    const liq=m.tm&&T>=m.tm+(m.fr||0);
    let cp=cpAt(m,T+step/2,liq);
    if(meltRange&&T+step/2>meltRange.T0&&T+step/2<meltRange.T1) cp+=meltRange.L/(meltRange.T1-meltRange.T0);
    H+=cp*(Tn-T); T=Tn; tT.push(T);tH.push(H);
  }
  if(meltRange){ev.push({T:meltRange.T0,T1:meltRange.T1,H0:HatT({tT,tH},meltRange.T0),H1:HatT({tT,tH},meltRange.T1),kind:'melt',label:'melting range'});}
  ev.sort((a,b)=>a.T-b.T);
  return {tT,tH,ev,Tmax};
}
function HatT(tab,T){ // lower side of any jump
  const {tT,tH}=tab; if(T<=tT[0]) return tH[0];
  let lo=0,hi=tT.length-1; if(T>=tT[hi]) return tH[hi];
  while(hi-lo>1){const mid=(lo+hi)>>1; if(tT[mid]<T) lo=mid; else hi=mid;}
  const t0=tT[lo],t1=tT[hi]; if(t1===t0) return tH[lo];
  return tH[lo]+(tH[hi]-tH[lo])*(T-t0)/(t1-t0);
}
function TfromH(tab,H){
  const {tT,tH,ev}=tab;
  let T; if(H<=tH[0]) T=tT[0]; else if(H>=tH[tH.length-1]) T=tT[tT.length-1]; else{
    let lo=0,hi=tH.length-1;
    while(hi-lo>1){const mid=(lo+hi)>>1; if(tH[mid]<=H) lo=mid; else hi=mid;}
    const h0=tH[lo],h1=tH[hi]; T=h1===h0?tT[lo]:tT[lo]+(tT[hi]-tT[lo])*(H-h0)/(h1-h0);
  }
  const fr={f:0,b:0,d:0,tr:0};
  for(const e of ev){
    const x=U.clamp((H-e.H0)/Math.max(1e-9,e.H1-e.H0),0,1);
    if(e.kind==='melt') fr.f=x; else if(e.kind==='boil'||e.kind==='subl') fr.b=x; else if(e.kind==='decomp') fr.d=x;
  }
  return {T,...fr};
}

/* ---- default state fractions from temperature (used for sweeps) ---- */
function fracsAt(m,T){
  const k=kind(m);
  let f=0;
  if(m.tm&&!(k==='poly'&&!m.xc)) f=m.fr>0?U.clamp((T-m.tm)/m.fr,0,1):(T>=m.tm?1:0);
  const b=m.tb&&T>=m.tb?1:0; const d=m.td&&!m.tb&&T>=m.td?1:0;
  return {f,b,d};
}

/* ---- steel heat treatment results ---- */
function steelMicroProps(m,micro){
  const si=m.si; const C=si.C;
  const fp=C<=0.76?U.clamp((C-0.02)/0.74,0,1):U.clamp((6.67-C)/5.91,0,1);

  if(!micro||micro.type==='asis') return null;
  const HVm=210+1150*Math.min(C,0.9)-650*Math.min(C,0.9)**2;
  let HV,label,fM=micro.fM||0,parts=[];
  if(micro.type==='coarse'){HV=110+140*fp;label='coarse pearlite'+(C<0.76?' + ferrite':(C>0.76?' + cementite':''));}
  else if(micro.type==='fine'){HV=140+190*fp;label='fine pearlite'+(C<0.6?' + ferrite':'');}

    const span=Math.max(50,si.A1-423); const x=U.clamp((micro.tempT-423)/span,0,1);
    const HVt=140+190*fp; HV=HV-(HV-HVt)*Math.pow(x,1.1)*fM; label='tempered '+label;
  }
  const uts=Math.min(2400,3.3*HV);
  const brittleness=fM*(1-U.clamp(((micro.tempT||0)-423)/400,0,1));
  const ys=uts*(0.62+0.28*fM);
  const el=Math.max(1.5,(m.el+8)*(1-0.92*brittleness)*(HV>400?0.6:1));
  return {HV:Math.round(HV),uts,ys,el,label,fM,HRC:hv2hrc(HV)};
}
function hv2hrc(HV){ if(HV<240) return null; return Math.round(interp([[240,20],[300,29.8],[400,40.8],[500,49.1],[600,55.2],[700,60.1],[800,64],[900,67],[1000,69]],HV)); }

/* ---- full property set at T ---- */
function propsAt(m,T,st){

    let ratio=1; const ref=structAt(m,293);
    if(m.c==='metal'&&S.s!==ref.s){const a=theoDensity(m,S),b2=theoDensity(m,ref); if(a&&b2) ratio=a/b2;}

  /* phase / state label */
  let phase='solid',state=S.name;
  const solidFrac=(1-f)*(1-b)*(1-d);
  if(k==='poly'){
    const tg=m.tg||200;

    else if(d>0){phase=d>=1?'decomposed':'decomposing';state=d>=1?'charred residue + pyrolysis gases':'decomposing (chains breaking)';}

    } else {

      else state=T<tg-8?'glassy':(T<tg+8?'glass transition (leathery)':'rubbery (softened)');
    }
  } else if(k==='glass'){
    const tg=m.tg;

    else {state='viscous melt (workable)';phase='liquid';}
  } else {
    if(b>=1){phase='gas';state=m.tm?'vapour':'vapour (sublimed)';}
    else if(b>0){phase='boiling';state=m.tm?`boiling (${Math.round(b*100)}% vapourised)`:`subliming (${Math.round(b*100)}%)`;}
    else if(d>=1){phase='gas';state='decomposed';}
    else if(d>0){phase='boiling';state=`decomposing (${Math.round(d*100)}%)`;}

  /* mechanical */

    if(k==='poly'){const sh=polyShapeE(m,T),s0=polyShapeE(m,293); let r=sh/s0; if(m.c==='composite'||m.c==='fiber') r=0.55+0.45*Math.min(r,1.5); return r;}
    if(k==='glass'){return T<m.tg?1-0.05*(T-293)/m.tg:Math.max(0,1-(T-m.tg)/120);}
    if(k==='cer') return T<293?1+0.05*(293-T)/293:Math.max(0.05,1-0.25*(T-293)/Tm);
    {const Tr=m.Tr||(m.tm&&m.tm<360?0.85*m.tm:293); return T<Tr?1+0.25*(Tr-T)/Tm:Math.max(0.08,1-0.45*(T-Tr)/Tm);}
  };
  let Er=Eshape();
  p.E=E0*Er*solidFrac*solidFrac;
  if(k==='met'){
    const Tr=m.Tr||(m.tm&&m.tm<360?0.85*m.tm:293); const hc=m.hc||0.5, g=h=>1/(1+Math.exp((h-hc)/0.07)), h0=Tr/Tm;
    let fy=g(p.hom)/g(h0), fu=(1/(1+Math.exp((p.hom-hc-0.03)/0.08)))/(1/(1+Math.exp((h0-hc-0.03)/0.08)));
    if(m.anom){const bump=h=>Math.exp(-Math.pow((h-0.58)/0.13,2));fy*=(1+1.8*bump(p.hom))/(1+1.8*bump(h0));}
    const bcc=['BCC','BCT'].includes(S.s);
    fy=Math.max(fy,0.025);fu=Math.max(fu,0.04);
    if(T<Tr){const x=(Tr-T)/Tr; if(bcc){fy*=1+1.4*x*x;fu*=1+0.5*x*x;} else {fy*=1+0.35*x;fu*=1+0.45*x;}}
    p.ys=ys0!=null?ys0*fy:null; p.uts=uts0*fu;
    let el=el0;
    if(!bcc||!m.dbtt){ if(p.hom>0.4) el*=1+0.8*U.clamp((p.hom-0.4)/0.4,0,1); if(T<Tr&&!bcc) el*=1+0.2*(Tr-T)/Tr; }
    if(bcc&&m.dbtt){ const wf=t=>U.smooth(m.dbtt-70,m.dbtt+30,t); const w=wf(T); el=Math.min(60,el/(0.05+0.95*wf(293)))*(0.05+0.95*w)*(T>m.dbtt+30?1+0.8*U.clamp((p.hom-0.4)/0.4,0,1):1); if(T<m.dbtt){p.flags.push({t:'brittle',msg:`Below its ductile-to-brittle transition (~${Math.round(m.dbtt)} K)`});} }

    p.ys=ys0!=null?ys0*sr:null; p.uts=uts0*sr;
    let el=el0*Math.pow(1/Math.max(r,1e-6),0.35);
    if(m.c==='composite'||m.c==='fiber') el=el0;
    if(T<(m.tg||0)-20&&!m.xc) el=Math.min(el,el0*(0.4+0.6*T/(m.tg||300)));
    if(m.xl&&T<(m.tg||0)) el=Math.min(el,3);
    p.el=U.clamp(el,0.3,2000);
  } else {
    let sf=k==='glass'?(T<m.tg?1:Math.max(0,1-(T-m.tg)/150)):(p.hom<0.55?1:Math.max(0.05,1-(p.hom-0.55)/0.45));
    p.ys=null;p.uts=uts0*sf;p.el=el0;
    if(k==='glass'&&T>m.tg){p.el=Math.min(500,(T-m.tg)*2);}
    if(k==='cer'&&p.hom>0.6&&m.c!=='fiber'){p.el=Math.max(el0,(p.hom-0.6)*20);}
  }
  if(p.ys!=null) p.ys*=solidFrac*solidFrac;
  p.uts*=solidFrac*solidFrac;
  if(p.ys!=null&&p.uts<p.ys*1.02) p.uts=p.ys*1.02;
  if(solidFrac<=0.001){p.E=0;p.ys=p.ys!=null?0:null;p.uts=0;p.el=null;}
  if(k==='poly'&&phase==='liquid'){p.E=0;p.uts=0;p.ys=p.ys!=null?0:null;p.el=null;}
  if(k==='glass'&&T>m.tg+150){p.E=0;p.uts=0;p.el=null;}
  p.hv=hv0?hv0*(p.uts/(uts0||1)):(k==='met'&&p.uts?((p.ys||p.uts*0.6)+p.uts)/6.2:null);

  const sc=m.sc&&T<m.sc&&solidFrac>0.99;
  if(k==='met'&&m.c==='metal'){
    const th=m.th||300; re=m.re*0.003+m.re*0.997*bgInt(T,th)/bgInt(293,th);

function polyShapeE(m,T){
  const tg=m.tg||200, G=polyG(m,T);

  const glassy=1.25-0.25*Math.min(T,tg)/tg;
  return G*glassy+(1-G)*rub;
}

/* ---- incandescence ---- */
function blackbodyRGB(T){
  const t=U.clamp(T,1000,40000)/100; let r,g,b;
  if(t<=66){r=255;g=99.4708025861*Math.log(t)-161.1195681661;}
  else{r=329.698727446*Math.pow(t-60,-0.1332047592);g=288.1221695283*Math.pow(t-60,-0.0755148492);}
  if(t>=66) b=255; else if(t<=19) b=0; else b=138.5177312231*Math.log(t-10)-305.0447927307;
  if(T<1000){const x=U.clamp((T-700)/300,0,1);g*=0.55+0.45*x;b*=x;}
  return [U.clamp(r,0,255)|0,U.clamp(g,0,255)|0,U.clamp(b,0,255)|0];
}
function glowInfo(T){
  const I=Math.pow(U.clamp((T-720)/1100,0,1),1.35);
  let name='none';
  if(T>=2600) name='blinding white';
  else if(T>=1600) name='white';
  else if(T>=1350) name='yellow';
  else if(T>=1180) name='orange';
  else if(T>=1000) name='cherry red';
  else if(T>=880) name='dull red';
  else if(T>=798) name='faint red (Draper point)';
  return {I,rgb:blackbodyRGB(Math.max(T,800)),name};
}

/* ---- stress–strain curve at T ---- */
function stressStrain(m,p){
  const k=kind(m), S=p.struct;
  if(!p.E||p.E<=0||p.uts<=0) return {pts:[],none:true};
  const E=p.E*1000; // MPa
  const pts=[]; let fail=true;
  if(m.id==='nitinol'||(m.Emart&&p.ys)){
    if(S.s==='B2'){const up=420+6*(p.T-318), lo=up-230; const e1=up/E*100;
      [[0,0],[e1,up],[e1+6,up*1.05],[e1+6+200/E*100,up*1.05+200],[e1+6+500/E*100,p.uts*0.95],[e1+6+500/E*100+3,p.uts]].forEach(q=>pts.push(q));
      return {pts,fail:true,super:true,unload:[[e1+6,lo],[e1,lo*0.95],[lo/E*100,lo*0.9],[0,0]]};}
    else{const pl=150; const e1=pl/E*100; [[0,0],[e1,pl],[e1+5,pl*1.15],[e1+5+400/(75000)*100,pl*1.15+400],[12,p.uts*0.9],[p.el,p.uts]].forEach(q=>pts.push(q)); return {pts,fail:true};}
  }
  if(k==='poly'&&m.c==='polymer'){
    const tg=m.tg||200;
    if(m.xl&&p.T>tg+8){ // rubber elasticity with finite extensibility
      const lmax=1+p.el/100, G=E/3; const n=60;
      let s1=0; for(let i=0;i<=n;i++){const l=1+(lmax-1)*i/n; s1=G*(l-1/(l*l))/(1-0.85*Math.pow((l-1)/(lmax-1),3)); pts.push([(l-1)*100,s1]);}
      const sc=p.uts/s1; pts.forEach(q=>q[1]*=Math.min(sc,8)); pts[pts.length-1][1]=p.uts; return {pts,fail:true};
    }
    if(p.el<6||p.ys==null){const ef=Math.min(p.el,p.uts/E*100*1.15); const n=24; for(let i=0;i<=n;i++){const e=ef*i/n; const s=p.uts*(1-Math.pow(1-e/ef,1.6*0+1.25))*(1)+0; pts.push([e,Math.min(E*e/100,p.uts*Math.pow(e/ef,0.85))]);} pts[pts.length-1][1]=p.uts; return {pts,fail:true};}
    const ey=Math.max(p.ys/E*100*1.5,2.5); const draw=0.8*p.ys;
    const n=12; for(let i=0;i<=n;i++){const e=ey*i/n;pts.push([e,p.ys*Math.sin(Math.PI/2*e/ey)]);}
    pts.push([ey*1.5,draw*1.02],[ey*2.2,draw]);
    const eh=p.el*0.75; if(eh>ey*2.2) pts.push([eh,draw*1.03]);
    pts.push([p.el,Math.max(p.uts,draw*1.1)]); return {pts,fail:true};
  }
  if(p.ys==null||p.el<1.2){
    const ef=p.uts/E*100; if(p.el>ef&&p.el<1.2&&k==='met'){pts.push([0,0],[ef*0.8,p.uts*0.8],[p.el,p.uts]);}
    else pts.push([0,0],[ef,p.uts]);
    return {pts,fail:true,brittle:true};
  }
  const ey=p.ys/E*100; pts.push([0,0],[ey,p.ys]);
  const eu=Math.max(ey+0.2,Math.min(0.62*p.el,25)); const e0=(eu-ey)/2.6;
  for(let i=1;i<=24;i++){const e=ey+(eu-ey)*i/24; const s=p.uts-(p.uts-p.ys)*Math.exp(-(e-ey)/Math.max(e0,0.05)); pts.push([e,s]);}
  const sEnd=pts[pts.length-1][1];
  if(p.el>eu+0.2){for(let i=1;i<=10;i++){const e=eu+(p.el-eu)*i/10; pts.push([e,sEnd*(1-0.22*Math.pow(i/10,1.8))]);}}
  return {pts,fail};
}

/* ======================= PHASE DIAGRAMS ======================= */
function interp(arr,x){ if(x<=arr[0][0]) return arr[0][1]; for(let i=1;i<arr.length;i++){ if(x<=arr[i][0]){const [x0,y0]=arr[i-1],[x1,y1]=arr[i]; return y0+(y1-y0)*(x-x0)/(x1-x0);} } return arr[arr.length-1][1]; }
function invInterp(arr,y){ for(let i=1;i<arr.length;i++){const [x0,y0]=arr[i-1],[x1,y1]=arr[i]; if((y>=y0&&y<=y1)||(y<=y0&&y>=y1)) return x0+(x1-x0)*(y-y0)/((y1-y0)||1);} return y<arr[0][1]?arr[0][0]:arr[arr.length-1][0]; }
const P=1.15;
function eutFns(D){
  const lowT=D.Tmin, XB=D.xb||100;
  return {
    liqA:c=>D.TA-(D.TA-D.TE)*Math.pow(c/D.cE,P),
    liqB:c=>D.TB-(D.TB-D.TE)*Math.pow(Math.max(0,XB-c)/(XB-D.cE),P),
    cLA:T=>D.cE*Math.pow(U.clamp((D.TA-T)/(D.TA-D.TE),0,1),1/P),
    cLB:T=>XB-(XB-D.cE)*Math.pow(U.clamp((D.TB-T)/(D.TB-D.TE),0,1),1/P),
    cSA:T=>D.am*U.clamp((D.TA-T)/(D.TA-D.TE),0,1),
    cSB:T=>XB-(XB-D.bm)*U.clamp((D.TB-T)/(D.TB-D.TE),0,1),
    solvA:T=>D.a0+(D.am-D.a0)*Math.pow(U.clamp((T-lowT)/(D.TE-lowT),0,1),2),
    solvB:T=>D.b0-(D.b0-D.bm)*Math.pow(U.clamp((T-lowT)/(D.TE-lowT),0,1),2)
  };
}
/* returns {key,label,phases:[{n,c,f}],micro:[{type,frac,col,desc}]} ; c wt% B, T °C */
function phaseAt(D,c,T){
  c=U.clamp(c,0,D.xMax||100);
  if(D.type==='iso'){

  addEventListener('pointermove',move,{passive:false}); addEventListener('pointerup',up); addEventListener('pointercancel',cleanup);

function startCardDrag(e,s){

function isAlloyable(m){ return kind(m)==='met'&&m.c!=='composite'&&((m.c==='metal'&&BASE_METALS.includes(m.f))||(m.base&&m.comp)); }
function asAddition(m){ if(m.c==='metal'&&ELEM[m.f]) return m.f; if(m.base&&ELEM[m.base]) return m.base; if((m.id==='graphite'||m.id==='diamond')) return 'C'; if(m.id==='si') return 'Si'; return null; }
function isMatrix(m){ return !m.mine&&((m.c==='polymer')||(m.c==='metal'&&kind(m)==='met'&&m.id!=='hg')||['al6061','al7075','ti64','ss304','in718','sic','al2o3','si3n4','soda','zro2','mgo'].includes(m.id)); }
function isReinf(m){ return !m.mine&&(m.c==='fiber'||['sic','al2o3','wc','soda','silica','graphite','diamond','tio2','zro2'].includes(m.id)); }
function comboHint(drop,tgt){
  if(isAlloyable(tgt.m)&&asAddition(drop)&&asAddition(drop)!==(tgt.m.base||tgt.m.f)) return `alloy into ${tgt.m.n}`;
  if(isMatrix(tgt.m)&&isReinf(drop)) return `reinforce ${tgt.m.n}`;
  if(isReinf(tgt.m)&&isMatrix(drop)) return `embed in ${drop.n}`;
  return 'no reaction: place nearby';
}
function combine(drop,tgt,dragSpec){
  const tm=tgt.m;
  if(isAlloyable(tm)&&asAddition(drop)&&asAddition(drop)!==(tm.base||tm.f)){ select(tgt.id,'alloy'); FGX.forSpec=null; openAlloy(tgt,asAddition(drop)); toast(`Alloying ${asAddition(drop)} into ${tm.n}: adjust the amount, then cast`); return; }
  if(isMatrix(tm)&&isReinf(drop)){ select(tgt.id,'composite'); CPX.forSpec=null; openComposite(tgt,{reinf:drop.id}); toast(`Reinforcing ${tm.n} with ${drop.n}`); return; }
  if(isReinf(tm)&&isMatrix(drop)){ select(tgt.id,'composite'); CPX.forSpec=null; openComposite(tgt,{matrix:drop.id}); toast(`Embedding ${tm.n} in ${drop.n}`); return; }
  if(!dragSpec) addSpec(drop,tgt.x+30,tgt.y+40); else { dragSpec.x=tgt.x+30; dragSpec.y=tgt.y+40; placeCard(dragSpec); }
  toast(`${drop.n} and ${tm.n} do not combine here`);
}

const DIAG_FOR={Fe:'FeC',Cu:'CuNi',Ni:'CuNi',Pb:'PbSn',Sn:'PbSn',Al:'AlSi',Si:'AlSi',Ag:'CuAg',Au:'AgAu',Bi:'SnBi',Mg:'MgAl'};
function specDiag(m){
  if(m.comp&&m.base){ const dg=findDiagram(m.base,Object.entries(m.comp).map(([el,w])=>({el,w}))); if(dg&&(!dg.approx||dg.rest<=3||dg.key==='FeC')) return dg; }
  const el=m.c==='metal'?m.f:(m.id==='si'?'Si':null);
  if(el&&DIAG_FOR[el]){const key=DIAG_FOR[el],D=DIAGRAMS[key]; return {key,D,cB:D.A===el?0:(D.xb||100),pure:true};}
  return null;
}
function diagramFor(s,sel){
  const preview=W.op==='alloy'&&FGX.forSpec===s.id&&FGX.res;
  if(sel&&sel!=='auto'){ const D=DIAGRAMS[sel]; const own=preview&&FGX.dg?FGX.dg:specDiag(s.m); const fits=!!(own&&own.key===sel);
    return {dg:{key:sel,D},cB:fits?own.cB:0,Tk:preview&&fits?FGX.T:s.T,marker:fits,msg:''}; }
  if(preview){ if(FGX.dg) return {dg:FGX.dg,cB:FGX.dg.cB,Tk:FGX.T,marker:true,msg:'Previewing your alloy recipe from the Alloy operation.'}; return {msg:'No built-in diagram for this recipe. Pick one from the list to explore.'}; }

}

  const items=[['heat','Heat / cool','H'],['alloy','Alloy','A'],['composite','Make composite','C'],['test','Tensile test','T'],['-'],['cmp',W.multi.has(s.id)?'Remove from comparison':'Add to comparison','X'],['pop','Pop out properties',''],['info','Explain the properties','I'],['-'],['dup','Duplicate','D'],['rm','Remove','Del']];
  m.innerHTML=items.map(([k,n,sc])=>k==='-'?'<hr>':`<button role="menuitem" data-k="${k}" ${['alloy','composite'].includes(k)&&!opAllowed(k,s.m)?'disabled':''}>${n}<span>${sc}</span></button>`).join('');
  document.body.appendChild(m); m.style.left=Math.min(x,innerWidth-230)+'px'; m.style.top=Math.min(y,innerHeight-m.offsetHeight-8)+'px';
  m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k; closeMenu();
    if(['heat','alloy','composite','test'].includes(k)) doOp(s,k);
    if(k==='cmp') toggleMulti(s.id); if(k==='pop'){select(s.id);openFloat({type:'w',key:'props',lock:s.id});}
    if(k==='info') openInfo('E'); if(k==='dup'){addSpec(s.m,s.x+24,s.y+24);} if(k==='rm') removeSpec(s.id); });
  setTimeout(()=>addEventListener('pointerdown',closeOnOut),0);
}
function closeOnOut(e){ if(!e.target.closest('#cmenu')) closeMenu(); }
function closeMenu(){ const m=$('#cmenu'); if(m) m.remove(); removeEventListener('pointerdown',closeOnOut); }
function tidyBench(){ const B=$('#bench').getBoundingClientRect(); const cw=176,ch=172; const cols=Math.max(1,Math.floor((B.width-16)/cw)); W.items.forEach((s,i)=>{s.x=12+(i%cols)*cw; s.y=12+Math.floor(i/cols)*ch; s.el.style.transition='transform .25s'; placeCard(s); setTimeout(()=>s.el.style.transition='',300);}); saveBench(); }
function initConveniences(){
  // card quick actions + context menu + shift-click (delegated)
  const bench=$('#bench');
  bench.addEventListener('contextmenu',e=>{const c=e.target.closest('.spec');if(!c)return;e.preventDefault();const s=W.items.find(q=>q.el===c);if(s){select(s.id);ctxMenu(e.clientX,e.clientY,s);}});
  bench.addEventListener('click',e=>{const q=e.target.closest('[data-qa]'); if(q){e.stopPropagation(); const s=W.items.find(x=>x.el===q.closest('.spec')); if(!s) return; const a=q.dataset.qa; if(a==='cmp') toggleMulti(s.id); else if(a==='menu'){const r=q.getBoundingClientRect();ctxMenu(r.left,r.bottom+4,s);} else doOp(s,a); return;}
    const c=e.target.closest('.spec'); if(c&&(e.shiftKey||e.ctrlKey||e.metaKey)){const s=W.items.find(x=>x.el===c); if(s) toggleMulti(s.id);} },true);
  bench.addEventListener('dblclick',e=>{const c=e.target.closest('.spec');if(!c)return;const s=W.items.find(x=>x.el===c);if(s) doOp(s,'heat');});
  let lp; bench.addEventListener('pointerdown',e=>{ if(e.pointerType!=='touch') return; const c=e.target.closest('.spec'); if(!c) return; const sx=e.clientX,sy=e.clientY; lp=setTimeout(()=>{const s=W.items.find(x=>x.el===c); if(s) ctxMenu(sx,sy,s);},550); const cancel=()=>{clearTimeout(lp);removeEventListener('pointerup',cancel);removeEventListener('pointermove',mv);}; const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>8)cancel();}; addEventListener('pointerup',cancel); addEventListener('pointermove',mv); });
  // info buttons anywhere
  document.addEventListener('click',e=>{const b=e.target.closest('[data-info]'); if(b){e.preventDefault();e.stopPropagation();openInfo(b.dataset.info);}},true);
  // shortcuts
  addEventListener('keydown',e=>{ if(e.target.closest('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey) return; const s=spec(W.sel); const k=e.key.toLowerCase();
    if(k==='escape'){closeMenu(); if(!DK.min){DK.min=true;INS.dirty=true;} return;}
    if(k==='i'){openInfo(); return;} if(k==='?'){openInfo('E');return;}
    if(!s) return;
    const map={h:'heat',a:'alloy',c:'composite',t:'test'}; if(map[k]&&opAllowed(map[k],s.m)){doOp(s,map[k]);e.preventDefault();}
    if(k==='x') toggleMulti(s.id); if(k==='d') addSpec(s.m,s.x+24,s.y+24); if(k==='delete'||k==='backspace'){removeSpec(s.id);e.preventDefault();} });
}

  ({heat:dHeat,alloy:dAlloy,composite:dComp,test:dTest})[W.op](s,$('#d-body'));

function dockTick(dt,force){
  const s=spec(W.sel); if(!s) return; (s.tests||[]).forEach(t=>{if(t.prog<1)t.prog=Math.min(1,t.prog+dt/1.6);}); if(DK.min) return; const p=s.p||propsAt(s.m,s.T,specState(s));
  DK.acc+=dt; const tick=force||DK.acc>0.22; if(tick) DK.acc=0;
  if(W.op==='heat'){ const cv=$('#d-stage'); if(cv) drawSpec(cv,s,p,true); if(tick) heatTick(s,p); }
  if(W.op==='test'&&tick) testTick(s,p);
}

/* ---------- HEAT / COOL ---------- */
function heatPresets(m){
  const P=[['LHe',4.2],['LN₂',77],['Room',293],['Boiling water',373]];
  if(m.tg) P.push(['Tg+30',m.tg+30]); if(m.ht) P.push(['Austenitise',m.si.A3+60]);
  if(m.tr) m.tr.slice(0,2).forEach(t=>{if(t.T>300)P.push([t.name.split(' ')[0],t.T+20]);});
  if(m.tc&&m.tc>300) P.push(['Curie',m.tc+20]); if(m.tm) P.push(['Melt',m.tm+(m.fr||0)+60]);
  if(m.tb) P.push([m.tm?'Boil':'Sublime',m.tb+150]); else if(m.td) P.push(['Decompose',m.td+60]);
  return P;
}
function dHeat(s,body){
  const m=s.m, tmax=Math.round(Math.max(1500,Math.min(s.tab.Tmax,6000)));
  body.innerHTML=`<div class="dgrid">
   <div class="dcol"><div class="stagebox"><canvas id="d-stage"></canvas><div class="tags" id="d-tags"></div><div class="foot" id="d-foot"></div></div></div>
   <div class="dcol"><h4>Setpoint <span class="mono" id="d-tgtl" style="float:right;text-transform:none;letter-spacing:0"></span></h4>
     <div class="combo"><input type="range" id="d-tgt" min="1" max="${tmax}" step="1" value="${Math.round(s.target)}" aria-label="Setpoint"><input type="number" id="d-tgtn" value="${Math.round(toDisp(s.target))}" aria-label="Setpoint value"></div>
     <div class="chips" id="d-pre">${heatPresets(m).map(([n,T])=>`<button class="chip" data-t="${T}">${esc(n)} <span class="mono" style="opacity:.7">${fT(T,false)}</span></button>`).join('')}</div>
     <div class="btns"><button class="btn ${s.heater?'on':''}" id="d-heater" aria-pressed="${s.heater}">${s.heater?'Heater on':'Heater off'}</button><button class="btn" id="d-jump">Jump to setpoint</button><button class="btn" id="d-fresh">Fresh sample</button></div></div>
   <div class="dcol"><label class="f" style="margin:0">Heater power <span class="mono" id="d-pwv" style="float:right;text-transform:none"></span><input type="range" id="d-pw" min="2" max="4.6" step="0.01" value="${Math.log10(s.Pmax)}"></label>
     <label class="f" style="margin:0">Surroundings<select id="d-env" style="margin-top:4px">${Object.entries(ENV).map(([k,v])=>`<option value="${k}" ${k===s.env?'selected':''}>${v.n}</option>`).join('')}</select></label>
     ${m.ht?`<h4 style="margin-top:6px">Quench / heat treat</h4><div class="btns" id="d-q"><button class="btn" data-q="water">Water</button><button class="btn" data-q="oil">Oil</button><button class="btn" data-q="brine">Brine</button><button class="btn" data-q="air">Air cool</button><button class="btn" data-q="anneal">Furnace cool</button></div><dl class="kv" id="d-htkv"></dl>`:''}</div>
  </div>`;
  const setT=T=>{s.target=U.clamp(T,1,6000);s.ramp=null;s.heater=true;syncHeat(s);};
  $('#d-tgt').addEventListener('input',e=>setT(+e.target.value));
  $('#d-tgtn').addEventListener('change',e=>setT(fromDisp(+e.target.value)));
  $('#d-pre').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const T=+b.dataset.t;if(T<ENV[s.env].Ta-1){s.env=T<20?'lhe':(T<200?'ln2':s.env);$('#d-env').value=s.env;}setT(T);});
  $('#d-heater').addEventListener('click',()=>{s.heater=!s.heater;s.ramp=null;syncHeat(s);});
  $('#d-jump').addEventListener('click',()=>{const T=Math.max(s.target,0.5);s.H=HatT(s.tab,T);s.frac=TfromH(s.tab,s.H);s.T=s.frac.T;if(m.ht&&T>=m.si.A1)s.aust=U.clamp((T-m.si.A1)/Math.max(1,m.si.A3-m.si.A1),0,1);slog(s,`Jumped to ${fT(T)}`);});
  $('#d-fresh').addEventListener('click',()=>{s.heater=false;s.env='air';s.ramp=null;s.target=293;resetSpec(s,293);s.log=[];s.tests=[];slog(s,'Fresh sample at 293 K');INS.dirty=true;});
  const pw=$('#d-pw'); const sp=()=>{s.Pmax=Math.pow(10,+pw.value);$('#d-pwv').textContent=s.Pmax>=1000?num(s.Pmax/1000,2)+' kW':Math.round(s.Pmax)+' W';}; pw.addEventListener('input',sp); sp();
  $('#d-env').addEventListener('change',e=>{s.env=e.target.value;});
  if(m.ht) $('#d-q').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const q=b.dataset.q; if(s.aust<=0) toast('Heat above A₃ first: no austenite to transform yet');
    if(q==='anneal'){s.env='air';s.heater=true;s.target=Math.max(s.T,s.target);s.ramp=1.0;slog(s,'Furnace cooling at 1 K/s');}
    else{s.env=q;s.heater=false;s.ramp=null;slog(s,`Quenched into ${ENV[q].n.split(' ·')[0].toLowerCase()}`); if(W.speed===0) setSpeed(5);}

function syncHeat(s){const b=$('#d-heater'); if(!b) return; b.classList.toggle('on',s.heater); b.setAttribute('aria-pressed',s.heater); b.textContent=s.heater?'Heater on':'Heater off'; $('#d-tgt').value=Math.round(s.target); if(document.activeElement!==$('#d-tgtn')) $('#d-tgtn').value=Math.round(toDisp(s.target));}
function heatTick(s,p){
  const m=s.m, env=ENV[s.env]; if(!$('#d-tags')) return;
  $('#d-tgtl').textContent=s.heater?`→ ${fT(s.target)}${s.ramp?' (ramping)':''}`:'heater off';
  const tags=[]; if(p.glow.name!=='none') tags.push(['hot','glow: '+p.glow.name]); if(p.mag&&p.mag.state==='ferromagnetic') tags.push(['','ferromagnetic']); if(p.sc) tags.push(['cold','superconducting']); if(p.brittle&&p.phase==='solid'&&kind(m)==='met') tags.push(['warn','brittle']); if(s.over) tags.push(['warn','over-aged']);
  if(s.heater&&s.P>=s.Pmax*0.995&&s.target>s.T+5&&Math.abs(s.dTdt)<0.05) tags.push(['warn','power-limited']);
  if(s.heater&&s.target<env.Ta-1&&s.T<=env.Ta+1) tags.push(['cold','bath warmer than setpoint']);
  $('#d-tags').innerHTML=tags.map(([c,t])=>`<span class="tag ${c}">${esc(t)}</span>`).join('');
  $('#d-foot').textContent=`${fT(s.T)} · heater ${num(s.P/1000,2)} kW · losses ${num(s.loss/1000,2)} kW · ${s.dTdt>=0?'+':''}${num(s.dTdt,2)} K/s`;
  if(s.ramp) syncHeat(s);
  if(m.ht){ const si=m.si; let micro; if(s.aust>0) micro=s.aust>=0.999?'austenite (γ)':`${Math.round(s.aust*100)}% austenite`; else if(s.micro.type==='asis') micro='as supplied'; else micro=steelMicroProps(m,s.micro).label;
    const mp=s.aust<=0&&s.micro.type!=='asis'?steelMicroProps(m,s.micro):null; const hv=mp?mp.HV:Math.round((m.ys+m.uts)/6.2);
    $('#d-htkv').innerHTML=[[si.hyper?'A<sub>cm</sub>':'A₃',fT(si.A3)],['A₁ / Mₛ',`${fT(si.A1)} / ${fT(si.Ms)}`],['Critical cooling rate',num(si.Rc,2)+' K/s'],['Last cooling rate',s.rate?num(s.rate,2)+' K/s':'—'],['Result',`${micro} · ${hv} HV${hv2hrc(hv)?' · '+hv2hrc(hv)+' HRC':''}`]].map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join(''); }
}

/* ---------- ALLOY (recipe here, diagram in status) ---------- */
const FGX={forSpec:null,base:'Fe',adds:[],age:false,T:null,res:null,dg:null};
function openAlloy(s,addEl){
  const m=s.m;
  if(FGX.forSpec!==s.id){ FGX.forSpec=s.id; FGX.base=m.base||m.f; FGX.adds=m.comp?Object.entries(m.comp).map(([el,w])=>({el,w})):[]; FGX.age=!!m.ppt; FGX.T=null; }
  if(addEl&&addEl!==FGX.base){ const ex=FGX.adds.find(a=>a.el===addEl); const w=addEl==='C'&&FGX.base==='Fe'?0.4:(ELEM[addEl].inter?0.3:10); if(ex) ex.w=+(ex.w+w).toFixed(2); else FGX.adds.push({el:addEl,w}); FGX.T=null; }
  if(!ST.on.has('diagram')){ST.on.add('diagram');stSave();}
  INS.dirty=true;
}
function dAlloy(s,body){
  if(FGX.forSpec!==s.id){ openAlloy(s); INS.dirty=false; }
  const B=ELEM[FGX.base];
  body.innerHTML=`<div class="dgrid">
   <div class="dcol"><h4>Recipe · base ${esc(FGX.base)} (${esc(B.n)})</h4><div id="a-adds"></div><div class="btns"><button class="btn" id="a-add">+ Add element</button></div>
     <div class="small muted" id="a-bal"></div><div class="compbar" id="a-bar"></div>
     <label class="f" id="a-agel" style="margin:2px 0 0"><input type="checkbox" id="a-age" ${FGX.age?'checked':''}> Age-harden (solution treat + age)</label>
     <label class="f" for="a-T" style="margin:2px 0 0">Preview temperature <span class="mono" id="a-Tv" style="float:right;text-transform:none"></span></label><input type="range" id="a-T" min="273" max="2000" step="1">
     <p class="tiny muted" style="margin:0">The phase diagram and phases for this recipe show in the status panel →</p></div>

   <div class="dcol"><h4>Hume-Rothery solubility</h4><div class="scroll-x"><table class="hrt" id="a-hr"></table></div><div class="col" style="gap:6px" id="a-flags"></div>

    if(e.target.type==='range'){FGX.adds[i].w=+e.target.value;r.querySelector('input[type=number]').value=FGX.adds[i].w;}
    if(e.target.type==='number'){FGX.adds[i].w=U.clamp(+e.target.value||0,0,99);r.querySelector('input[type=range]').value=FGX.adds[i].w;} aUpdate();});
  A.addEventListener('change',e=>{const r=e.target.closest('.addrow');if(r&&e.target.matches('select')){FGX.adds[+r.dataset.i].el=e.target.value;aRows();aUpdate();}});
  A.addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){FGX.adds.splice(+b.dataset.rm,1);aRows();aUpdate();}});
  $('#a-age').addEventListener('change',e=>{FGX.age=e.target.checked;aUpdate();});
  $('#a-T').addEventListener('input',e=>{FGX.T=+e.target.value;$('#a-Tv').textContent=fT(FGX.T);});
  $('#a-match').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b){addSpec(MAT[b.dataset.add],null,null,{select:false});toast('Placed the catalogue sample on the bench');}});
  $('#a-cast').addEventListener('click',()=>{const m=alloyToMaterial(FGX.res,$('#a-name').value.trim()||'My alloy');addMine(m);addSpec(m,null,null,{op:'heat'});toast(`Cast “${m.n}” onto the bench`);});
  aRows(); aUpdate(FGX.T==null);
}
function aRows(){
  const opts=el=>Object.keys(ELEM).filter(e=>e!==FGX.base).map(e=>`<option value="${e}"${e===el?' selected':''}>${e}</option>`).join('');
  $('#a-adds').innerHTML=FGX.adds.map((a,i)=>{const mx=ELEM[a.el].inter?(a.el==='C'?6.67:2):99;const st=mx<10?0.01:0.1;

  let armed=false; $('#clear').addEventListener('click',e=>{ if(!W.items.length) return; if(!armed){armed=true;e.target.textContent='Sure?';setTimeout(()=>{armed=false;e.target.textContent='Clear';},2500);return;} armed=false; e.target.textContent='Clear'; W.items.slice().forEach(s=>removeSpec(s.id)); toast('Bench cleared'); });
  initConveniences();
  if(!loadBench()||!W.items.length) addSpec(MAT.fe,null,null,{select:false});
  fwLoad();
  benchEmpty(); select(W.items.length?W.items[0].id:null);
  const re=()=>{refreshColors();for(const k in DGC) delete DGC[k];INS.dirty=true;};
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',re);}catch(e){}
  new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{INS.dirty=true;const B=$('#bench').getBoundingClientRect();W.items.forEach(s=>{s.x=U.clamp(s.x,0,Math.max(0,B.width-170));s.y=U.clamp(s.y,0,Math.max(0,B.height-170));placeCard(s);});},150);});
  let last=performance.now(),acc=0;
  const loop=now=>{ const dt=Math.min(0.05,(now-last)/1000); last=now; acc+=dt; const tick=acc>0.2; if(tick) acc=0;
    try{
      for(const s of W.items){ simSpec(s,dt); const p=propsAt(s.m,s.T,specState(s)); s.p=p; specEvents(s,p); drawIcon(s.cv,s,p); if(tick) cardText(s,p); }
      if(INS.dirty){INS.dirty=false; renderDock(); renderStatus();}
      dockTick(dt); statusTick(dt); floatTick(dt,tick);
    }catch(err){ console.error(err); }
    requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
</script>
